body:
  text: 大隋北印度三藏闍那崛多譯如是我聞一時佛在舍衛國祇陀林中孤獨精舍與大比丘僧千二百五十人俱大菩薩衆四萬人俱娑婆世界主梵天王釋提桓因四大天王提頭賴吒天王毗留勒叉天王毗留博叉天王毗沙門天王將二十八部鬼神大將軍如是等諸天八萬四千呵利多將其子及眷屬悉來會坐爾時去此佛世界過十萬億佛土有世界名衆華佛號最勝燈王如來等正覺今現在説法遣二菩薩一名大光二名無量光而告之曰善男子汝持此陀羅尼句至娑婆世界與釋迦牟尼佛此呪多所饒益能令衆生長夜安隱獲大善利色力名譽即説呪曰𭉝隸摩訶𭉝隸𭉝羅尼阿溪摩溪用吳音娑曼汦摩訶娑曼汦薩移莎攬寐娑波呵時二菩薩從佛受持此陀羅尼句猶如壯夫屈申臂頃從衆華國沒到舍衛國祇陀林中孤獨精舍時二菩薩前禮佛足却住一面白佛言世尊去此佛世界過十萬億佛土有世界名衆華佛號最勝燈王如來正等覺今現在説法遣我等來問訊世尊無病無惱諸弟子衆不為若魔若鬼若天若龍若夜叉若浮陀若富單那若毗舍耶若餓鬼若干人鬼若乾陀鬼若狂人鬼若使人心亂鬼若方道鬼若起死尸鬼若一日二日三日四日發病鬼若日月星宿師子虎豹毒蛇狼狗蝙蝠人若非人而來惱害怖畏之者無有是處阿難若有善男子善女人受持讀誦書寫解説廣令流布此陀羅尼句火不能燒不溺水死刀不能傷毒不能害王亦不殺梵等諸天不嫌恨之能自憶念十世生事阿難此呪是七十七億諸佛所説若有違犯此呪及持呪者奪其精氣即為侵毀違逆是諸佛已爾時彌勒菩薩即從坐起整衣服偏袒右肩右膝著地合掌叉手前白佛言世尊我今亦欲説陀羅尼句用饒益衆生令獲善利色力名譽即説呪曰阿婆哪拘哪阿䨲跋帝婆羅提跋致兜樓寐樓漏寐阿那迦賜波那迦賜迦賜摩訶迦賜阿䨲多波羅䨲多却翅摩訶却翅斯陀𮞱啼利多檀底啼利寐利知利尸利哹寐摩訶哹寐哹哹寐哹賒婆帝娑波呵爾時佛復告阿難汝當受持讀誦書寫解説廣令流布此陀羅尼句所以者何阿難此呪能自憶念十三世生事阿難此呪是八十四億諸佛所説若有違犯此呪及持呪者奪其精氣即為侵毀違逆是諸佛已爾時文殊師利法王子菩薩摩訶薩即從坐起齊整衣服偏袒右肩右膝著地合掌叉手前白佛言世尊我今亦欲説陀羅尼句欲饒益衆生令獲善利色力名譽即説呪曰阿叉企娑企那祇那祇膩那祇娑隸婆那尼利𭈽呵疑𭈽呵羅跋致禪弟疑禪提羅跋致娑波呵爾時佛復告阿難汝當受持讀誦書寫解説廣令流布此陀羅尼句所以者何阿難此呪能自憶念十三世生事阿難此呪是過去九十九億諸佛之所共説若有違犯此呪及持呪者奪其精氣即為侵毀是諸佛已爾時釋迦牟尼佛告諸大衆我今亦欲説陀羅尼句用饒益衆生令獲善利色力名譽即説呪曰阿婆哪拘哪單祇過單祇羅𣹜隸樓漏隸嗘隸郫隸押隸娑波呵爾時佛復告阿難汝當受持讀誦書寫解説廣令流布此陀羅尼句所以者何阿難此呪是三世諸佛所説普除一切患難魔事繫縛擁護某甲令得安隱若有毒病若風冷病若除結病若心腹脊痛眼耳身痛及以頭痛如是等患最勝燈王如來遣陀羅尼句來與世尊亦欲令此娑婆世界衆生長夜安隱獲大善利色力名譽説呪如上爾時四天王以佛神力命不中夭佛告阿難若入賊中當念此呪若入水火欲詣王宮亦當念此呪若有種種鬪諍疾病怖畏之處亦當憶念此呪若有王賊水火若天龍若夜叉若浮陀若富單那若毗舍闍若餓鬼若乾陀鬼若狂人鬼若使人心亂鬼若方道鬼若起死尸鬼若吸人精氣鬼若一日二日三日四日發病鬼若日月星宿師子虎豹毒蛇狼狗若蝙蝠若人若非人而來惱害怖畏之者無有是處阿難若有比丘比丘尼善男子及善女人若有受持讀誦書寫解説廣令流布此陀羅尼句火不能燒不溺水死刀不能傷毒不能害不中方道若以此呪結縷繫枯樹上求哀救護還生華果何況人耶惟除宿業已定果報阿難若於清旦日中及以日暮三時誦行不令使有廢捨重罪為輕若有死罪得杖即止應被杖者呵責便當即止若有所求即得勝意以此神呪力故諸佛聖人之所護念故爾時四大天王即從座起整衣服偏袒右肩右膝著地合掌叉手前白佛言世尊我今亦欲説陀羅尼句用饒益衆生令獲善利色力名譽若有比丘比丘尼優婆塞優婆夷受持讀誦書寫解説廣令流布此陀羅尼句若有惡人若非人不能得其便即説呪曰多𭉐他多檀多檀喋毗檀喋多陀耶槃泥亶互喋過羯泥噘檛泥噘檛泥談摩隸襜摩隸娑波呵爾時世尊即説偈言此陀羅尼經諸佛先已説我今亦演暢饒益諸衆生若人信樂心聞持如是呪能增於辨才其所往來處不遭諸厄難無有人非人鳩槃富單那不能作惱害誦持此呪故不為他所殺誦持此呪故天魔王波旬欲界中特尊不能作留難誦持此經故父母及兄弟眷屬及親厚不逢諸衰禍誦持此經故於百千億劫造作不善業十惡及五逆七日能令滅誦持此呪故菩薩於億劫積集諸功德七日能令勝誦持此呪故四大天王尊毗頭羅提頭博叉毗留茶大臣衆眷屬歡喜而讚歎恭敬常守護誦持此呪故佛説此經已舍利弗及諸比丘一切世間天人阿修羅等聞佛所説皆大歡喜頂戴奉行作禮而去乞夢即知吉凶陀羅尼南無三寶南無摩尼跋陀大鬼神將摩訶怛茶陀羅尼尼律師那氷伽梨阿梨伽梨㖑多氷伽梨阿跋多蛇阿跋多蛇摩尼跋陀林摩訶乾豆波乾陀四天王提頭賴吒天毗樓勒天惟睒門天毗沙門天忉利天鹽摩羅天兜率陀天不憍樂天他應聲天化自在天梵衆妙天梵輔祿天摩訶梵天水行梵天水微梵天水無量梵天水應林天約淨天遍淨明天守妙天微妙天極妙天福愛勝天近際天普觀天快見天無結受天色究竟天淨光天普等天是為三十三訶尼訶尼訶尼佉訶尼佉頭佉尼佉知佉知佉呪水與人飲之阿竭帝波羅竭帝波羅僧竭帝婆羅毗羅延帝波羅波羅摩牟闍摩牟闍羅帝三波羅闍羅帝毗提提希希尼尼憂句隸牟句頭帝檀那竭帝檀那羅帝檀那僧多羅伊波呵大要縛鬼一縛鬼二香爐婆利摩訶婆利闍梨摩訶闍梨塸牟訶沙婆帝摩訶沙婆帝阿波吒僧金吒陀羅尼多陀呵阿伽闍尼婆毗薩婆達摩尼婆毗伊舍摩陀毗婆舍那毗摩羅修鉢離達摩尼佉那婆樓尼文夜多摩隸遮隸睺樓睺樓朔鞞帝曼多羅曼多羅娑呵支波晝支波晝呼奴波晝呼奴波晝浮樓波晝浮樓波晝支波晝支波晝阿若波晝都呼那鉢晝舍摩奴波晝胡修帝鉢晝蜜祇呼那波晝伊呼希那鉢晝尼犁祇帝帝那鉢晝婆若帝那鉢晝密若奴呼帝那鉢晝鬱庶臭帝那波晝娑呵上天轉鉢呪南無摩等耆那南無摩等阿羅闍羅南無摩才伽伽利伽他利伽那怛衫那摩悉吉利埵飲摩毗婆羅婆叉咩桑毗闍桑毗闍底阿吒尼婆吒尼婆曼陀阿樓休吒僧伽毗咩阿悉多多梨央求瑟吒波羶底他利伽陀利伽那地脾那斫蓄娑佛陀薩氈達摩薩氈僧伽薩氈辟支佛陀薩氈阿羅漢薩氈提婆薩氈律師薩氈波羶底他利伽他利伽那地脾那斫蓄娑莎呵呪鏡須童男子若見道人威儀齊整及外國人者此事皆吉若見道人形容醜陋及見人啼哭著敗衣裳是不吉相此經丹藏即云東方最勝燈王如來經文句大多陪宋本而有餘按開元録云前後四譯三存一失即東晉失譯名為陀羅尼章句經或無章字者是第三譯而一闕本也今此崛多譯宋丹兩本文義大別名亦小異未知孰是意者宋本古質似非崛多之譯又於文中數云陀羅尼句即恐此經是失本陀羅尼句經宋藏失崛多譯而得東晉失本陀羅尼經見經中有最勝燈王之言遂為崛多所譯燈王經耳不然何一人之譯而有名題始末之殊廣略質文之異耶今雙存之則四譯還具矣
